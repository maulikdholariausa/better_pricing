services:
  app:
    image: ${APP_IMAGE:-contract-negotiations:local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-prod}
      QUOTES_PREFIX: ${QUOTES_PREFIX:-quotes-prod}
      PUBLIC_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env},https://www.${DOMAIN}
      SITE_URL: https://${DOMAIN}
      SEO_INDEXABLE: ${SEO_INDEXABLE:-true}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      GTM_CONTAINER_ID: ${GTM_CONTAINER_ID:-GTM-5V25KW4H}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      QUOTES_BUCKET: ${QUOTES_BUCKET:-haveaguru-quotes-prod}
      NOTIFY_CONFIGURATION_ID: ${NOTIFY_CONFIGURATION_ID:-}
      NOTIFY_CODE_CONFIGURATION_ID: ${NOTIFY_CODE_CONFIGURATION_ID:-}
      SMS_MONTHLY_SEND_LIMIT: ${SMS_MONTHLY_SEND_LIMIT:-400}
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      REQUIRE_CLOUDFRONT: ${REQUIRE_CLOUDFRONT:-false}
    volumes:
      - ${DATA_PATH:-/srv/contract-negotiations/data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
      ORIGIN_HOST: ${ORIGIN_HOST:-origin.${DOMAIN}}
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PERSIST_PATH:-/srv/contract-negotiations}/caddy-data:/data
      - ${PERSIST_PATH:-/srv/contract-negotiations}/caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      options: {max-size: 10m, max-file: '3'}
